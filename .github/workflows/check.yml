name: Engineering checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm ci --ignore-scripts --prefix skills/piano-score-to-musicxml
      - run: npm test --prefix skills/piano-score-to-musicxml
      - run: npm run build
      - run: npm run build:pages
