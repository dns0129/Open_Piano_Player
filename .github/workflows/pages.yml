name: Deploy web version

on:
  workflow_run:
    workflows: ["Engineering checks"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: >
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Require a successful Engineering checks run for this commit
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          conclusion=$(gh run list \
            --workflow "Engineering checks" \
            --commit "$GITHUB_SHA" \
            --json status,conclusion,headBranch,event \
            --jq '[.[] | select(.headBranch=="main" and .event=="push")][0] | if . == null then "missing" elif .status != "completed" then .status else .conclusion end')
          if [ "$conclusion" != "success" ]; then
            echo "Engineering checks for $GITHUB_SHA is '$conclusion'. Refusing to publish."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:pages
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/
      - name: Add the promo site at /site/
        run: cp -R site dist-pages/site
      - run: touch dist-pages/.nojekyll
      - name: Publish dist-pages to gh-pages
        run: |
          sha=$(git rev-parse HEAD)
          cd dist-pages
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Deploy ${sha}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
