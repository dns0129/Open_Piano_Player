<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>会员推荐 · 流程演示</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f3ef;color:#25362f;font:15px/1.6 -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}button,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:13px 20px;background:#235b48;color:white;font-weight:600}button:disabled{opacity:.4;cursor:default}button.secondary{background:#e8ede8;color:#235b48}header{border-bottom:1px solid #dddeda;padding:20px 5%;display:flex;justify-content:space-between;align-items:center}small,.muted{color:#778079}.tag{display:inline-block;border-radius:30px;background:#e3eade;color:#476044;padding:4px 12px;font-size:12px}main{max-width:1180px;margin:45px auto;padding:0 24px}h1{font-size:38px;line-height:1.3;letter-spacing:-1px;margin:12px 0}h2{font-size:20px;margin:0 0 12px}p{margin:8px 0}.intro{display:flex;justify-content:space-between;align-items:end;gap:20px}.layout{display:grid;grid-template-columns:1fr 360px;gap:34px;margin-top:32px}.story{background:white;border:1px solid #e2e4df;border-radius:22px;padding:28px}.steps{display:flex;gap:6px;margin:0 0 30px}.step{flex:1;border-top:4px solid #e6e9e4;padding-top:9px;font-size:12px;color:#8a918b}.step.on{border-color:#307359;color:#235b48}.people{display:grid;grid-template-columns:1fr 36px 1fr;align-items:center;gap:8px}.person{background:#f5f6f2;border-radius:16px;padding:20px}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#d8e6dd;font-size:19px;font-weight:700;margin-bottom:10px}.b{background:#eee3ce}.person strong{display:block}.arrow{text-align:center;color:#97a89b}.action{margin-top:26px;padding-top:24px;border-top:1px solid #e9ece6}.action h2{font-size:23px}.action button{margin-top:16px;width:100%}.phone{background:white;border:7px solid #293d33;border-radius:36px;padding:23px 20px;box-shadow:0 20px 50px #233d3310}.phonehead{display:flex;justify-content:space-between;font-size:12px;margin-bottom:30px}.wallet{background:#235b48;color:white;border-radius:18px;padding:22px;margin-top:20px}.amount{font-size:37px;line-height:1.5;font-weight:650;letter-spacing:-1px}.wallet small{color:#cadcd1}.balances{display:flex;justify-content:space-between;margin-top:15px;border-top:1px solid #ffffff30;padding-top:14px}.balances strong{display:block;font-size:18px}.row{display:flex;justify-content:space-between;padding:15px 0;border-bottom:1px solid #eceee8;font-size:13px}.note{background:#f5f2e9;border-radius:12px;padding:14px;font-size:12px;color:#7b7158;margin-top:20px}.receipt{padding:14px;background:#eff5ed;border-radius:12px;margin-top:15px;font-size:13px}select{padding:8px;border:1px solid #dce1d9;border-radius:8px;background:white;color:#294d3e;max-width:100%}.log{margin-top:25px;font-size:13px}.log p{padding:8px 0;border-bottom:1px solid #e6e8e0}.footer{margin:24px 0;color:#82887e;font-size:12px}.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap} @media(max-width:800px){main{margin:25px auto}.layout{grid-template-columns:1fr}.intro{display:block}h1{font-size:29px}.tools{margin-top:20px}.phone{max-width:400px;width:100%;margin:auto}.story{padding:20px}.person{padding:13px}.step{font-size:10px}}
</style></head><body><header><strong>会员推荐 <span class="muted">/ 合伙人演示</span></strong><span class="tag">示例数据 · 模拟交易</span></header><main><div class="intro"><div><small>从一次推荐，到一笔收益</small><h1>好体验，分享给下一位。</h1><p class="muted">跟着用户 A 和用户 B，走完推荐、付款与佣金到账的全过程。</p></div><div class="tools"><button class="secondary" id="back">上一步</button><button class="secondary" id="reset">重新演示 ↺</button></div></div><div class="layout"><section class="story"><div class="steps" id="steps"></div><div class="people"><div class="person"><div class="avatar">A</div><strong>用户 A · 推荐人</strong><small id="astatus"></small></div><div class="arrow">→</div><div class="person"><div class="avatar b">B</div><strong>用户 B · 新客户</strong><small id="bstatus"></small></div></div><div class="action" aria-live="polite"><span class="tag" id="phase"></span><h2 id="title"></h2><p class="muted" id="description"></p><div id="choice"><label for="plan">B 购买的会员档位　</label><select id="plan"><option value="0">美神会员 · HK$39,800 · 5%</option><option value="1">白金会员 · HK$69,800 · 10%</option><option value="2">黑金会员 · HK$99,800 · 30%</option></select></div><div id="detail" class="receipt"></div><button id="next"></button></div><div class="log"><strong>本次演示记录</strong><div id="log" aria-live="polite"></div></div></section><aside><div class="phone"><div class="phonehead"><strong>9:41</strong><span>● ● ●</span></div><small>用户 A 的视角</small><h2>我的推广中心</h2><div class="wallet"><small>可提现佣金（HKD）</small><div class="amount" id="available">0.00</div><div class="balances"><div><small>冻结中</small><strong id="frozen">0.00</strong></div><div><small>累计佣金</small><strong id="total">0.00</strong></div></div></div><div class="row"><span>直接推荐人数</span><strong id="invites">0 人</strong></div><div class="row"><span>已付款人数</span><strong id="paid">0 人</strong></div><div class="row"><span>提现状态</span><strong id="withdraw">暂无申请</strong></div><div class="note" id="note"></div><div id="payout" class="receipt" hidden></div></div><p class="footer">演示中可直接推进一个自然月；实际业务需等待冻结期结束，并核对退款记录。</p></aside></div><p class="footer">独立前端演示，金额均为港币示例。付款、邀请、审核和打款均为模拟，不创建真实订单，不产生真实收付款。</p></main><script>
const plans=[{name:'美神',price:39800,rate:.05},{name:'白金',price:69800,rate:.1},{name:'黑金',price:99800,rate:.3}];let step=0;const $=id=>document.getElementById(id),money=n=>n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});const titles=['A 先购买，成为会员','A 分享专属邀请给 B','B 接受邀请，绑定推荐关系','B 完成会员付款','推进冻结期，解锁佣金','A 提交佣金提现申请','后台审核并记录人工打款','推荐收益，完成闭环'];const descriptions=['先模拟 A 购买美神会员，获得会员身份与专属邀请入口。','A 将自己的专属邀请分享给朋友 B。','模拟 B 从 A 的邀请进入，直接介绍人确认为 A。','选择 B 的入会档位，模拟付款后，为 A 生成一笔冻结佣金。','模拟推进一个香港时区自然月，并确认该笔订单没有退款。','将可提现佣金全部提交申请，页面展示手续费和预计实收。','模拟后台审核通过，并完成线下人工打款、登记凭证。','B 的付款带来一笔直接推荐奖励，A 已收到扣除手续费后的款项。'];const actions=['模拟 A 付款 · HK$39,800','生成 A 的专属邀请','模拟 B 接受邀请','模拟 B 付款','推进一个自然月 · 确认无退款','模拟提交提现申请','模拟审核通过并完成人工打款','再演示一次'];function render(){const p=plans[+$('plan').value],c=p.price*p.rate;const earned=step>=4,unlocked=step>=5,requested=step>=6,done=step>=7;$('steps').innerHTML=['A 入会','分享邀请','绑定关系','B 付款','佣金解锁','申请提现','完成打款'].map((x,i)=>`<div class="step ${i<=step?'on':''}">${i+1}. ${x}</div>`).join('');$('phase').textContent=step===7?'演示完成':`第 ${step+1} 步 / 共 7 步`;$('title').textContent=titles[step];$('description').textContent=descriptions[step];$('next').textContent=actions[step];$('back').disabled=step===0;$('choice').hidden=step!==3;$('astatus').textContent=step?'美神会员 · 已付款 HK$39,800':'待购买会员';$('bstatus').textContent=earned?`${p.name}会员 · 已付款`:step>=3?'直接介绍人：A':step===2?'收到 A 的邀请':'尚未进入';$('available').textContent=money(unlocked&&!requested?c:0);$('frozen').textContent=money(earned&&!unlocked?c:0);$('total').textContent=money(earned?c:0);$('invites').textContent=(step>=3?1:0)+' 人';$('paid').textContent=(earned?1:0)+' 人';$('withdraw').textContent=done?'已打款':requested?'待审核':'暂无申请';$('detail').textContent=step<2?'A 购买美神会员：储值 HK$39,800 + 39,800 积分，会员有效期 12 个自然月。':step<3?'专属邀请码：DEMO-A · 邀请人：用户 A':step<4?`B 入会实付 HK$${money(p.price)} × ${p.rate*100}% = A 佣金 HK$${money(c)}（只奖励直接介绍人）`:`B 实付 HK$${money(p.price)} × ${p.rate*100}% = A 佣金 HK$${money(c)}${unlocked?' · 已解锁':' · 冻结一个自然月'}`;$('note').textContent=done?'打款已完成。实收金额与佣金分开记账，避免将手续费计入实收。':requested?'提现申请已提交，该笔金额已占用，等待后台审核与人工打款。':earned?'佣金来源：B 的会员入会订单。付款后先冻结，满一个自然月并核对无退款后解锁。':'分享邀请本身不产生佣金；B 通过邀请关系完成有效付款后，才计算奖励。';$('payout').hidden=!requested;$('payout').textContent=`申请 HK$${money(c)} − 手续费 10%（HK$${money(c*.1)}）= ${done?'实际到账':'预计实收'} HK$${money(c*.9)}`;const logs=['A 购买美神会员，会员、储值与积分到账','A 生成专属邀请 DEMO-A','B 接受邀请，绑定直接介绍人 A',`B 付款 HK$${money(p.price)}，A 获得冻结佣金 HK$${money(c)}`,'推进一个自然月，模拟核对无退款，佣金解锁',`A 提现 HK$${money(c)}，手续费 HK$${money(c*.1)}`,`后台记录模拟凭证 DEMO-PAYOUT-001，A 实收 HK$${money(c*.9)}`];$('log').innerHTML=step?logs.slice(0,step).map((x,i)=>`<p><small>0${i+1}</small>　${x}</p>`).join(''):'<p class="muted">点击上方按钮，开始演示。</p>'} $('next').onclick=()=>{step=step===7?0:step+1;render()};$('back').onclick=()=>{step=Math.max(0,step-1);render()};$('reset').onclick=()=>{step=0;$('plan').value='0';render()};$('plan').onchange=render;render();
</script></body></html>
